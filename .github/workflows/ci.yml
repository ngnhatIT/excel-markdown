name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    # App chỉ phát hành cho Windows: chạy cả Windows để bắt lỗi đường dẫn / xuống dòng / tên file
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
